AWSTemplateFormatVersion: 2010-09-09
Resources:
  ECRRepository:
    Type: "AWS::ECR::Repository"
    Properties:
      RepositoryName: my-public-repo
      RepositoryPolicyText:
        Version: 2012-10-17
        Statement:
          - Sid: AllowPull
            Effect: Allow
            Principal: "*"
            Action:
              - "ecr:GetDownloadUrlForLayer"
              - "ecr:BatchGetImage"
              - "ecr:BatchCheckLayerAvailability"
Outputs:
  ECRRepositoryId:
    Description: ECRRepository Id
    Value:
      Ref: ECRRepository
  ECRRepositoryArn:
    Description: ECRRepositoryArn
    Value: !GetAtt ECRRepository.Arn
