Outputs:
  MySecurityGroupOutputs:
    Description: Security Group Resource Id
    Value: !Ref MySecurityGroup

  MyLambdaExecutionRole:
    Description: My Lambda Execution Role Arn
    Value: !GetAtt MyLambdaExecutionRole.Arn

  MyLambdaFunction:
    Description: My Lambda Function Name
    Value: !Ref MyLambdaFunction

  MyCustomResource:
    Description: My Custom Resource
    Value: !Ref MyCustomResource

  DefaultSecurityGroupId:
    Description: The ID of the default security group in the specified VPC.
    Value: !GetAtt MyCustomResource.SecurityGroupId