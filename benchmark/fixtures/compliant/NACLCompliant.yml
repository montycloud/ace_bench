AWSTemplateFormatVersion: '2010-09-09'
Resources:
  MyNetworkAcl:
    Type: 'AWS::EC2::NetworkAcl'
    Properties:
      VpcId: !ImportValue VPCID

  InboundAllowAll1:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      NetworkAclId: !Ref MyNetworkAcl
      RuleNumber: 100
      Protocol: 6  # TCP
      RuleAction: allow
      Egress: false
      CidrBlock: '192.0.10.0/24'
      PortRange:
        From: 22
        To: 22

  InboundAllowAll2:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      NetworkAclId: !Ref MyNetworkAcl
      RuleNumber: 110
      Protocol: 6  # TCP
      RuleAction: allow
      Egress: false
      CidrBlock: '192.0.10.0/24'
      PortRange:
        From: 3389
        To: 3389

  OutboundAllowAll:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      NetworkAclId: !Ref MyNetworkAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: '0.0.0.0/0'

Outputs:
  NACLID:
    Description: NACL ID
    Value: !Ref MyNetworkAcl