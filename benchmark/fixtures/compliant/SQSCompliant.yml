AWSTemplateFormatVersion: "2010-09-09"
Description: SQS Queue Compliance Check

Resources:
  MyQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: "warf-test-sqs-queue-compliant"
  MyQueuePolicy:
    Type: "AWS::SQS::QueuePolicy"
    Properties:
      Queues:
        - !Ref MyQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sqs:SendMessage
            Resource: !GetAtt MyQueue.Arn
Outputs:
  MyQueueId:
    Value: !Ref MyQueue
  MyQueueArn:
    Value: !GetAtt [MyQueue, Arn]
  MyQueueName:
    Value: !GetAtt [MyQueue, QueueName]
  MyQueueUrl:
    Value: !GetAtt [MyQueue, QueueUrl]
